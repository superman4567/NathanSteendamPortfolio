<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Unity WebGL Build</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <script>
    // Configuration for Unity
    const buildUrl = "UnityBuild/Build";
    const loaderUrl = `${buildUrl}/UnityBuild.loader.js`;
    const config = {
      arguments: [],
      dataUrl: `${buildUrl}/UnityBuild.data.br`,
      frameworkUrl: `${buildUrl}/UnityBuild.framework.js.br`,
      codeUrl: `${buildUrl}/UnityBuild.wasm.br`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PortfolioGame",
      productVersion: "0.1.0",
    };

    // Create Unity Instance and enable fullscreen on load
    const canvas = document.querySelector("#unity-canvas");

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Optional: Log progress to console or update a progress bar
        console.log(`Loading progress: ${progress * 100}%`);
      }).then((unityInstance) => {
        // Set fullscreen automatically on load
        unityInstance.SetFullscreen(1);
      }).catch((message) => {
        alert(`Error: ${message}`);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
