<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Nathan Steendam | Portfolio Website</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    @font-face {
    font-family: 'CustomFont';
    src: url('TemplateData/fonts/CustomFont.woff2') format('woff2'),
         url('TemplateData/fonts/CustomFont.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
   #orientation-lock {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    color: white;
    font-family: 'Segoe UI', sans-serif; /* Or use Google Fonts */
    z-index: 10000;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-direction: column;
    }

    #orientation-lock div {
    max-width: 80%;
    }

    #orientation-logo {
    width: 128px;
    height: auto;
    margin-bottom: 20px;
    }

    #orientation-lock p {
    font-size: 20px;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <!-- Orientation Warning Overlay -->
  <div id="orientation-lock">
    <div>
      <img src="TemplateData/logo/LogoSquare_.png" alt="Logo" id="orientation-logo">
      <p>Please rotate your device to landscape to play.</p>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build 1.0.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Build 1.0.data.unityweb",
      frameworkUrl: buildUrl + "/Build 1.0.framework.js.unityweb",
      codeUrl: buildUrl + "/Build 1.0.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "PortfolioGame",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var orientationLock = document.getElementById("orientation-lock");

    function checkOrientation() {
      if (isMobile) {
        if (window.innerHeight > window.innerWidth) {
          orientationLock.style.display = "flex";
        } else {
          orientationLock.style.display = "none";
        }
      }
    }

    window.addEventListener("load", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    window.addEventListener("resize", checkOrientation);

    if (isMobile) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // Optional: Reduce pixel ratio for performance
      // config.devicePixelRatio = 1;
    } else {
      canvas.style.width = "1920px";
      canvas.style.height = "1080px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
