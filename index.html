<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity WebGL Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="loading-bar">
      <div id="loading-bar-full"></div>
    </div>
  </div>

  <script src="UnityBuild/Build/UnityBuild.loader.js"></script>
  <script>
    const unityInstance = UnityLoader.instantiate("unity-canvas", "UnityBuild/Build/Build.json", {
      onProgress: (instance, progress) => {
        document.getElementById("loading-bar-full").style.width = (progress * 100) + "%";
      }
    });
  </script>
</body>
</html>
