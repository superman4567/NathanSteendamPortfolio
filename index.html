<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | PortfolioGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Make the canvas and container use 100% of the viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Disable scrolling */
        }

        #unity-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">PortfolioGame</div>
        </div>
    </div>
    <script>
        var canvas = document.querySelector("#unity-canvas");

        // Function to try enabling full screen
        function tryFullscreen() {
            if (canvas.requestFullscreen) {
                canvas.requestFullscreen().catch((err) => {
                    console.warn("Fullscreen request was denied:", err);
                });
            } else if (canvas.webkitRequestFullScreen) {
                canvas.webkitRequestFullScreen();
            } else if (canvas.msRequestFullscreen) {
                canvas.msRequestFullscreen();
            } else {
                console.warn("Fullscreen is not supported in this browser.");
            }
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Build 1.0.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/Build 1.0.data.unityweb",
            frameworkUrl: buildUrl + "/Build 1.0.framework.js.unityweb",
            codeUrl: buildUrl + "/Build 1.0.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "PortfolioGame",
            productVersion: "0.1.0",
            showBanner: (msg, type) => {
                var warningBanner = document.querySelector("#unity-warning");
                var div = document.createElement('div');
                div.innerHTML = msg;
                if (type === 'error') div.style = 'background: red; padding: 10px;';
                else if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
                warningBanner.appendChild(div);
                warningBanner.style.display = 'block';
                if (type !== 'error') {
                    setTimeout(() => {
                        warningBanner.removeChild(div);
                        if (!warningBanner.children.length) warningBanner.style.display = 'none';
                    }, 5000);
                }
            },
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = tryFullscreen;

                // Automatically try full screen after Unity instance is loaded
                tryFullscreen();
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
